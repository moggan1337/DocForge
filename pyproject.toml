[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docforge"
version = "1.0.0"
description = "Auto-generate documentation from Python source code"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
authors = [
    {name = "moggan1337"}
]
keywords = ["documentation", "docstring", "python", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "click>=8.1.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    "astor>=0.8.1",
    "colorama>=0.4.6",
]

[project.scripts]
docforge = "src.cli:cli"

[tool.setuptools]
packages = ["src"]
